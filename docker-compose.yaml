services:
  frontend:
    build:
      context: .
      dockerfile: $DOCKERFILE
      args:
        - VITE_API_URL=$VITE_API_URL
    ports:
      - "5173:$FRONTEND_PORT_INTERNAL"
    volumes:
      - .:/app                # Geändert von ./frontend auf .
      - /app/node_modules      # Wichtig: Verhindert, dass lokale node_modules die im Container überschreiben
    environment:
      - VITE_API_URL=$VITE_API_URL