<!doctype html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/trainer/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IT-Trainer</title>
    <meta name="description" content="IT-Trainer – Übe Hex, Binär, Dezimal und Unicode-Konvertierungen interaktiv mit Bestenliste." />
    <style>
      /* Prevent white border flash before CSS loads */
      html, body { margin: 0; padding: 0; background-color: #0a0a0a; }
    </style>
    <script>
      // Apply theme before paint to prevent flash of wrong colors
      (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static fallback content for First Contentful Paint -->
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a0a0a; color: #e5e5e5; font-family: system-ui, -apple-system, sans-serif;">
        <div style="text-align: center;">
          <div style="font-size: 1.5rem; font-weight: bold; margin-bottom: 1rem;">IT Trainer</div>
          <div style="font-size: 0.875rem; color: #a1a1a1;">Loading…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
