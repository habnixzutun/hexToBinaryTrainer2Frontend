name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:8000' }}

      - name: Fix asset paths in build output (remove /trainer prefix for serve)
        run: |
          find dist -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) \
            -exec sed -i 's|/trainer/|/|g' {} +

      - name: Install Google Chrome
        run: |
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update && sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

      - name: Install LHCI CLI
        run: npm install -g @lhci/cli@0.15.1

      - name: Run Lighthouse Collect & save snapshots
        run: npx lhci collect --config=.lighthouserc.json && cp -r .lighthouseci lighthouse-artifacts

      - name: Upload Lighthouse reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: lighthouse-artifacts
          retention-days: 30

      - name: Run Assertions
        run: npx lhci assert --config=.lighthouserc.json

