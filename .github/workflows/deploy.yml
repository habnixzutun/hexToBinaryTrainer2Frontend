name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and accept host keys
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "Trying ssh-keyscan for ${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PORT }}"
          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" -t ecdsa,ssh-rsa "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>&1 || true
          cat ~/.ssh/known_hosts | head -1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: VITE_API_URL
          script: |
            set -e

            DEPLOY_DIR="${{ secrets.FRONTEND_DEPLOY_DIR }}"
            cd "$DEPLOY_DIR"

            git pull origin main

            DOCKERFILE=Dockerfile.prod \
            VITE_API_URL=${{ secrets.VITE_API_URL }} \
            FRONTEND_PORT_INTERNAL=80 \
            docker compose up --build -d --remove-orphans

            docker image prune -f
