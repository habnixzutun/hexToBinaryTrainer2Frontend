server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Error pages
    error_page 400 /400.html;
    error_page 401 /401.html;
    error_page 403 /403.html;
    error_page 404 /404.html;

    # Clean URLs for error pages
    location = /400 { rewrite ^ /400.html last; }
    location = /401 { rewrite ^ /401.html last; }
    location = /403 { rewrite ^ /403.html last; }
    location = /404 { rewrite ^ /404.html last; }

    location /trainer/assets/ {
        alias /usr/share/nginx/html/assets/;
    }

    location /trainer {
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
